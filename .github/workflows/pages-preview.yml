name: Pages Preview

# 官网（docs/）的发布前预览：PR 打开/更新时，把 docs/ 部署为一次
# 「preview 部署」——拿到独立的临时 URL，不碰正式站点。
#
# 注意：preview 部署要求 Pages 构建源为 GitHub Actions（legacy 的
# Deploy-from-branch 会 400："Deployments are only allowed from main"，
# 实测踩过）。生产发布见 pages-deploy.yml。
# 预览链接在本 job 的 step summary 和 PR 的 Deployments 侧栏；PR 更新时
# 自动替换，合并/关闭后 GitHub 按部署保留策略回收。

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - 'docs/**'
      - '.github/workflows/pages-preview.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  preview:
    name: Deploy docs preview
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload docs
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy preview
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          preview: true

      - name: Write preview URL to job summary
        run: |
          echo "## 🔀 官网预览已就绪" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "本次 PR 的 docs/ 预览地址（独立 URL，不影响正式站点）：" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**${{ steps.deployment.outputs.page_url }}**" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "> 正式站点只在 PR 合并进 main 后由 pages-deploy.yml 更新。" >> $GITHUB_STEP_SUMMARY
