name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（如 0.32.0），不填则使用 package.json 当前版本'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Bump version (package.json + manifest.json via postversion hook).
      # 输入版本 == 当前版本时跳过 npm version（会报 "Version not changed"），
      # 直接走当前版本 —— 覆盖"发当前已 bump 但未发布的版本"的场景。
      # 输入可带可选的 v 前缀（用户可能照 GitHub tag 习惯输 v0.31.1），先剥掉再比较。
      - name: Bump version
        id: ver
        run: |
          INPUT="${{ github.event.inputs.version }}"
          INPUT="${INPUT#v}"
          CURRENT=$(node -p "require('./package.json').version")
          if [ -n "$INPUT" ] && [ "$INPUT" != "$CURRENT" ]; then
            # 版本回退防护（v0.35.3 翻车复盘）：package.json 已到 0.35.10 而
            # 手填 0.35.3 时，npm version 会顺从地降级——打出比既有 tag 还小
            # 的版本号，且 tag 指向 runner 本地提交。直接拒绝。
            LOWER=$(node -e "const p=s=>s.split('.').map(Number);const i=p('$INPUT'),c=p('$CURRENT');for(let k=0;k<3;k++){if(i[k]!==c[k]){console.log(i[k]<c[k]?'yes':'no');process.exit(0)}}console.log('no')")
            if [ "$LOWER" = "yes" ]; then
              echo "::error::输入版本 v$INPUT 低于 package.json 当前版本 v$CURRENT — 版本不能回退。留空输入则按当前版本发 v$CURRENT。"
              exit 1
            fi
            npm version "$INPUT" --no-git-tag-version
          fi
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Version: $VERSION"

      - name: Run tests
        run: npm test

      - name: Run MV3 compat check
        run: bash check-compat.sh

      - name: Build zip
        run: npm run package

      - name: Verify zip exists
        run: |
          ZIP="browsa-v${{ steps.ver.outputs.version }}.zip"
          if [ ! -f "$ZIP" ]; then
            echo "::error::Expected $ZIP but it was not found"
            ls -la browsa-v*.zip 2>/dev/null || echo "No zip files found"
            exit 1
          fi
          ls -lh "$ZIP"

      # bump 提交只留在本地 runner，随 tag 一起推送（tag 指向含新版本号的
      # commit）。不开 release 分支、不开 PR：gh 在 Actions 里没有 GH_TOKEN
      # 会静默失败，历史上 release PR 从未建成过，11 个 release 的 tag 因此
      # 互相不成祖先，自动 notes 一路回退锚到 v0.31.2、把历史 PR 全量重列。
      - name: Commit version bump + push tag
        id: bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          VERSION="${{ steps.ver.outputs.version }}"
          git fetch origin --tags --quiet
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null 2>&1; then
            echo "::error::Tag v$VERSION already exists — bump the version, or delete the old release+tag to redo."
            exit 1
          fi
          git add package.json package-lock.json manifest.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: release v$VERSION [skip ci]"
          fi
          git tag -a "v$VERSION" -m "browsa v$VERSION"
          # bump commit 同时推到 release/vX 分支：tag 若只挂在 runner 本地
          # 提交上（分支不可达），generate-notes 的索引疑似走低优先级队列
          # ——v0.35.2/v0.35.3/v0.35.10 三次实测全部 404 超 6 分钟；旧设计
          # tag 打在已推分支上时无此现象。推不动不阻塞（只影响 notes 速度）。
          git push origin "HEAD:refs/heads/release/v$VERSION" || echo "::warning::release 分支推送失败——tag 将分支不可达，notes 可能长时间 404"
          git push origin "v$VERSION"

      # notes 显式指定上一个 tag 生成（版本序次新），只含当前增量——
      # 与 tag 之间的祖先关系、release PR 是否合入全部无关。
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ steps.ver.outputs.version }}"
          PREV=$(git tag --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | grep -vx "v$VERSION" | head -1)
          ARGS=(releases/generate-notes -f tag_name="v$VERSION")
          if [ -n "$PREV" ]; then ARGS+=(-f previous_tag_name="$PREV"); fi
          # generate-notes 对刚推送的 tag 会 404：notes 后端索引滞后于 git
          # ref 可见性（v0.35.2 实测 ~30 秒，v0.35.3 实测可超过 6 分钟——
          # 3 分钟窗口 12 次全 404 翻车）。以退出码为准判断成败——gh 出错时
          # 会把错误 JSON 打到 stdout，BODY 是否为空不可靠。窗口加宽到
          # ~7 分钟；仍失败则用 git log 本地生成 notes 兜底——zip/tests
          # 都已跑完，release 不该死在 notes 上，PR 链接版可事后在 release
          # 页编辑。
          BODY=""
          NOTES_OK=""
          for i in $(seq 1 20); do
            if BODY=$(gh api "${ARGS[@]}" -q .body); then NOTES_OK=1; break; fi
            echo "::warning::generate-notes failed (attempt $i/20) — tag v$VERSION 刚推送、notes 后端索引滞后，20 秒后重试"
            BODY=""
            sleep 20
          done
          if [ -z "$NOTES_OK" ]; then
            echo "::warning::generate-notes 20 次（~7 分钟）仍 404——git log 本地生成 notes 兜底发布，需要 PR 链接版请到 release 页编辑"
            RANGE="v$VERSION"
            # 注意 PREV 自带 v 前缀（git tag 输出），只给 VERSION 补 v——
            # 写成 v$PREV 会变成 vv0.35.2，git fatal 128（v0.35.10 实测）。
            [ -n "$PREV" ] && RANGE="$PREV..v$VERSION"
            BODY=$(git log --format='- %s' "$RANGE")
            [ -z "$BODY" ] && BODY="browsa v$VERSION"
          fi
          gh release create "v$VERSION" "browsa-v$VERSION.zip" \
            --title "browsa v$VERSION" \
            --notes "$BODY"
