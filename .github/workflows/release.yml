name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（如 0.32.0），不填则使用 package.json 当前版本'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Bump version (package.json + manifest.json via postversion hook).
      # 输入版本 == 当前版本时跳过 npm version（会报 "Version not changed"），
      # 直接走当前版本 —— 覆盖"发当前已 bump 但未发布的版本"的场景。
      # 输入可带可选的 v 前缀（用户可能照 GitHub tag 习惯输 v0.31.1），先剥掉再比较。
      - name: Bump version
        id: ver
        run: |
          INPUT="${{ github.event.inputs.version }}"
          INPUT="${INPUT#v}"
          CURRENT=$(node -p "require('./package.json').version")
          if [ -n "$INPUT" ] && [ "$INPUT" != "$CURRENT" ]; then
            # 版本回退防护（v0.35.3 翻车复盘）：package.json 已到 0.35.10 而
            # 手填 0.35.3 时，npm version 会顺从地降级——打出比既有 tag 还小
            # 的版本号，且 tag 指向 runner 本地提交。直接拒绝。
            LOWER=$(node -e "const p=s=>s.split('.').map(Number);const i=p('$INPUT'),c=p('$CURRENT');for(let k=0;k<3;k++){if(i[k]!==c[k]){console.log(i[k]<c[k]?'yes':'no');process.exit(0)}}console.log('no')")
            if [ "$LOWER" = "yes" ]; then
              echo "::error::输入版本 v$INPUT 低于 package.json 当前版本 v$CURRENT — 版本不能回退。留空输入则按当前版本发 v$CURRENT。"
              exit 1
            fi
            npm version "$INPUT" --no-git-tag-version
          fi
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Version: $VERSION"

      - name: Run tests
        run: npm test

      - name: Run MV3 compat check
        run: bash check-compat.sh

      - name: Build zip
        run: npm run package

      - name: Verify zip exists
        run: |
          ZIP="browsa-v${{ steps.ver.outputs.version }}.zip"
          if [ ! -f "$ZIP" ]; then
            echo "::error::Expected $ZIP but it was not found"
            ls -la browsa-v*.zip 2>/dev/null || echo "No zip files found"
            exit 1
          fi
          ls -lh "$ZIP"

      # bump 提交只留在本地 runner，随 tag 一起推送（tag 指向含新版本号的
      # commit）。不开 release 分支、不开 PR：gh 在 Actions 里没有 GH_TOKEN
      # 会静默失败，历史上 release PR 从未建成过，11 个 release 的 tag 因此
      # 互相不成祖先，自动 notes 一路回退锚到 v0.31.2、把历史 PR 全量重列。
      - name: Commit version bump + push tag
        id: bump
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          VERSION="${{ steps.ver.outputs.version }}"
          git fetch origin --tags --quiet
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null 2>&1; then
            # tag 已存在 = 上次发版跑到一半的残留（tag 推送在 release 创建之前）。
            # release 也在 → 已完整发过，直接收尾；release 缺失 → 跳过 bump/tag
            # 往下走，由 Create 步骤补建 release——把"手动删 tag 重来"变成
            # "重跑一次"。能走到这里的重跑只有"当前版本补完"一种：给旧版本
            # 补发已被 Bump 步骤的版本回退防护挡住。
            if gh release view "v$VERSION" >/dev/null 2>&1; then
              echo "::notice::v$VERSION 已完整发布（tag + release 均在）——本次运行无事可做，若 notes 是兜底版会在下一步顺手升级。"
            else
              echo "::notice::tag v$VERSION 已存在但 release 缺失（上次运行失败残留）——跳过 bump/tag，按当前代码补建 release。"
            fi
            exit 0
          fi
          git add package.json package-lock.json manifest.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: release v$VERSION [skip ci]"
          fi
          git tag -a "v$VERSION" -m "browsa v$VERSION"
          # bump commit 同时推到 release/vX 分支，让 tag 指向的提交保持分支
          # 可达（克隆/浅检出可解析，不悬空）。注意：实测这对 generate-notes
          # 的 404 滞后没有影响——v0.35.11 推了分支仍 404 满 7 分钟，v0.35.2
          # 未推分支反而一次成功（Create 步骤注释）。推不动不阻塞。
          git push origin "HEAD:refs/heads/release/v$VERSION" || echo "::warning::release 分支推送失败——tag 指向的提交将仅由 tag 引用保持可达"
          git push origin "v$VERSION"

      # 发布顺序（v0.35.11 复盘后倒转）：zip/tests 都已跑完，release 本身
      # 不该等 notes——generate-notes 后端对刚推 tag 的 404 滞后实测在
      # 30 秒～1 小时+ 之间波动（v0.35.3/v0.35.10/v0.35.11 三次翻车全部
      # 源于此；且与 tag 是否在已推分支上无关）。所以：
      #   1) 先试一次 generate-notes（成功即带完整 notes 发布，常态路径零改动）；
      #   2) 404 则立即用本地 git log 兜底发布——zip 上线是主要交付物；
      #   3) 发布后再给后端 ~2 分钟（6×20s）窗口升级 notes，升级失败不
      #      影响发布结果，warning 里给后端恢复后的手动刷新命令。
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ steps.ver.outputs.version }}"
          # notes 显式指定上一个 tag 生成（版本序次新），只含当前增量——
          # 与 tag 之间的祖先关系、release PR 是否合入全部无关。
          PREV=$(git tag --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | grep -vx "v$VERSION" | head -1)
          ARGS=(releases/generate-notes -f tag_name="v$VERSION")
          if [ -n "$PREV" ]; then ARGS+=(-f previous_tag_name="$PREV"); fi
          # 以退出码为准判断成败——gh 出错时会把错误 JSON 打到 stdout，
          # 捕获变量是否为空不可靠（PR #97 的退出码门闸）。
          UPGRADED=""
          if NOTES=$(gh api "${ARGS[@]}" -q .body); then
            UPGRADED=1
          else
            NOTES=""
          fi
          # 本地兜底。注意 PREV 自带 v 前缀，只给 VERSION 补 v——写成 v$PREV
          # 会变成 vv0.35.2，git fatal 128（v0.35.10 实测翻车点）。
          if [ -z "$NOTES" ]; then
            RANGE="v$VERSION"
            [ -n "$PREV" ] && RANGE="$PREV..v$VERSION"
            NOTES=$(git log --format='- %s' "$RANGE")
            [ -z "$NOTES" ] && NOTES="browsa v$VERSION"
          fi
          PREEXIST=""
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            PREEXIST=1
            echo "::notice::release v$VERSION 已存在——跳过创建，仅尝试升级 notes。"
          else
            gh release create "v$VERSION" "browsa-v$VERSION.zip" \
              --title "browsa v$VERSION" \
              --notes "$NOTES"
          fi
          if [ -z "$UPGRADED" ]; then
            for i in $(seq 1 6); do
              sleep 20
              if NEW=$(gh api "${ARGS[@]}" -q .body); then
                if gh release edit "v$VERSION" --notes "$NEW" >/dev/null; then
                  echo "::notice::notes 已升级为 generate-notes 版（第 $i 次重试）"
                  UPGRADED=1
                  break
                fi
              fi
            done
            if [ -z "$UPGRADED" ]; then
              echo "::warning::generate-notes 后端 ~2 分钟内未恢复（实测滞后可达 1 小时+），release 已带本地兜底 notes 发布。后端恢复后手动刷新："
              echo "::warning::gh api \"repos/$GITHUB_REPOSITORY/releases/generate-notes\" -f tag_name=v$VERSION -f previous_tag_name=$PREV -q .body | gh release edit v$VERSION --notes-file -"
            fi
          elif [ -n "$PREEXIST" ]; then
            # 重跑补完场景：release 已在但挂着旧兜底 notes，顺手升级。
            gh release edit "v$VERSION" --notes "$NOTES" >/dev/null && \
              echo "::notice::旧兜底 notes 已升级为 generate-notes 版"
          fi
