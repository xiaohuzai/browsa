name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（如 0.32.0），不填则使用 package.json 当前版本'
        required: false
        default: ''

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Bump version (package.json + manifest.json via postversion hook).
      # 输入版本 == 当前版本时跳过 npm version（会报 "Version not changed"），
      # 直接走当前版本 —— 覆盖"发当前已 bump 但未发布的版本"的场景。
      # 输入可带可选的 v 前缀（用户可能照 GitHub tag 习惯输 v0.31.1），先剥掉再比较。
      - name: Bump version
        id: ver
        run: |
          INPUT="${{ github.event.inputs.version }}"
          INPUT="${INPUT#v}"
          CURRENT=$(node -p "require('./package.json').version")
          if [ -n "$INPUT" ] && [ "$INPUT" != "$CURRENT" ]; then
            npm version "$INPUT" --no-git-tag-version
          fi
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Version: $VERSION"

      - name: Run tests
        run: npm test

      - name: Run MV3 compat check
        run: bash check-compat.sh

      - name: Build zip
        run: npm run package

      - name: Verify zip exists
        run: |
          ZIP="browsa-v${{ steps.ver.outputs.version }}.zip"
          if [ ! -f "$ZIP" ]; then
            echo "::error::Expected $ZIP but it was not found"
            ls -la browsa-v*.zip 2>/dev/null || echo "No zip files found"
            exit 1
          fi
          ls -lh "$ZIP"

      # main 有分支保护（PR + status check），不能直接 push。
      # 版本号 bump 提交到 release/ 分支并开 PR，由用户手动合入。
      # Release tag 指向这个已含新版本号的 release 分支 commit。
      - name: Commit version bump to release branch + open PR
        id: bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json manifest.json

          if git diff --cached --quiet; then
            echo "No version changes — tagging current HEAD"
            echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
            echo "pr=skipped" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          BRANCH="release/v${{ steps.ver.outputs.version }}"
          git checkout -b "$BRANCH"
          git commit -m "chore: release v${{ steps.ver.outputs.version }} [skip ci]"
          git push origin "$BRANCH"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

          # 若已有同名 PR 则不重复创建（重跑同版本时）
          PR_NUM=$(gh pr list --base main --head "$BRANCH" --state open --json number -q '.[0].number' 2>/dev/null || true)
          if [ -z "$PR_NUM" ]; then
            PR_NUM=$(gh pr create --base main --head "$BRANCH" \
              --title "chore: release v${{ steps.ver.outputs.version }}" \
              --body "由 Release workflow 自动生成的版本号 bump PR，合并即可。" | tail -1)
          fi
          echo "pr=$PR_NUM" >> "$GITHUB_OUTPUT"

      # 创建 GitHub Release（tag 指向含新版本号的 release 分支 commit，zip 挂附件）
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: browsa v${{ steps.ver.outputs.version }}
          target_commitish: ${{ steps.bump.outputs.sha }}
          generate_release_notes: true
          files: browsa-v${{ steps.ver.outputs.version }}.zip
