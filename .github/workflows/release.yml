name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（如 0.32.0），不填则使用 package.json 当前版本'
        required: false
        default: ''

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # ── 全量测试结果复用（2026-09-24，与 ci.yml 同一缓存空间）──────────
      # 测试步虽在 Bump 之后，但 bump 当时尚未提交——HEAD^{tree} 读的是已提交
      # 树 = 这次要发的内容树（CI 刚全量测过的那份）。命中即复用，发版不再
      # 重跑全量；未命中（首发新树/缓存过期）照常全量并回填记录。
      - name: Compute tree hash
        id: tree
        run: echo "hash=$(git rev-parse 'HEAD^{tree}')" >> "$GITHUB_OUTPUT"

      - name: Lookup previous full-test result
        id: testcache
        uses: actions/cache/restore@v4
        with:
          path: .fulltest-pass
          key: fulltest-${{ runner.os }}-node20-${{ steps.tree.outputs.hash }}
          lookup-only: true

      # Bump version (package.json + manifest.json via postversion hook).
      # 输入版本 == 当前版本时跳过 npm version（会报 "Version not changed"），
      # 直接走当前版本 —— 覆盖"发当前已 bump 但未发布的版本"的场景。
      # 输入可带可选的 v 前缀（用户可能照 GitHub tag 习惯输 v0.31.1），先剥掉再比较。
      - name: Bump version
        id: ver
        run: |
          INPUT="${{ github.event.inputs.version }}"
          INPUT="${INPUT#v}"
          CURRENT=$(node -p "require('./package.json').version")
          if [ -n "$INPUT" ] && [ "$INPUT" != "$CURRENT" ]; then
            # 版本回退防护（v0.35.3 翻车复盘）：package.json 已到 0.35.10 而
            # 手填 0.35.3 时，npm version 会顺从地降级——打出比既有 tag 还小
            # 的版本号，且 tag 指向 runner 本地提交。直接拒绝。
            LOWER=$(node -e "const p=s=>s.split('.').map(Number);const i=p('$INPUT'),c=p('$CURRENT');for(let k=0;k<3;k++){if(i[k]!==c[k]){console.log(i[k]<c[k]?'yes':'no');process.exit(0)}}console.log('no')")
            if [ "$LOWER" = "yes" ]; then
              echo "::error::输入版本 v$INPUT 低于 package.json 当前版本 v$CURRENT — 版本不能回退。留空输入则按当前版本发 v$CURRENT。"
              exit 1
            fi
            npm version "$INPUT" --no-git-tag-version
          fi
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Version: $VERSION"

      - name: Reuse full-test result
        if: steps.testcache.outputs.cache-hit == 'true'
        run: echo "::notice::全量测试结果复用自同树同环境的既有记录（tree ${{ steps.tree.outputs.hash }}）"

      - name: Run tests
        if: steps.testcache.outputs.cache-hit != 'true'
        run: npm test

      - name: Run MV3 compat check
        run: bash check-compat.sh

      - name: Record full-test result
        if: steps.testcache.outputs.cache-hit != 'true' && success()
        run: echo "passed by ${{ github.sha }} at $(date -u +%FT%TZ)" > .fulltest-pass

      - name: Save full-test result
        if: steps.testcache.outputs.cache-hit != 'true' && success()
        uses: actions/cache/save@v4
        with:
          path: .fulltest-pass
          key: fulltest-${{ runner.os }}-node20-${{ steps.tree.outputs.hash }}

      - name: Build zip
        run: npm run package

      - name: Verify zip exists
        run: |
          ZIP="browsa-v${{ steps.ver.outputs.version }}.zip"
          if [ ! -f "$ZIP" ]; then
            echo "::error::Expected $ZIP but it was not found"
            ls -la browsa-v*.zip 2>/dev/null || echo "No zip files found"
            exit 1
          fi
          ls -lh "$ZIP"

      # bump 提交随 tag 推到 release/vX 分支（tag 指向含新版本号的 commit），
      # 并由末尾的「Open version bump PR and auto-merge」自动开 PR 合回 main——
      # 此前（v0.31～v0.40.3 时代）bump 只随 tag 走、从不落回 main，gh 又没配
      # GH_TOKEN 导致 release PR 从未建成，main 上的 manifest/package 版本号
      # 长期落后于已发 tag（cws-listing 口径的「manifest 旧值属常态」）。现在
      # GH_TOKEN 用 github.token + pull-requests: write 显式配齐，PR 自动开、
      # 自动合（仅版本号文件才自动合，见末尾步骤的安全阀）。
      - name: Commit version bump + push tag
        id: bump
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          VERSION="${{ steps.ver.outputs.version }}"
          git fetch origin --tags --quiet
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null 2>&1; then
            # tag 已存在 = 上次发版跑到一半的残留（tag 推送在 release 创建之前）。
            # release 也在 → 已完整发过，直接收尾；release 缺失 → 跳过 bump/tag
            # 往下走，由 Create 步骤补建 release——把"手动删 tag 重来"变成
            # "重跑一次"。能走到这里的重跑只有"当前版本补完"一种：给旧版本
            # 补发已被 Bump 步骤的版本回退防护挡住。
            if gh release view "v$VERSION" >/dev/null 2>&1; then
              echo "::notice::v$VERSION 已完整发布（tag + release 均在）——本次运行无事可做，若 notes 是兜底版会在下一步顺手升级。"
            else
              echo "::notice::tag v$VERSION 已存在但 release 缺失（上次运行失败残留）——跳过 bump/tag，按当前代码补建 release。"
            fi
            exit 0
          fi
          git add package.json package-lock.json manifest.json
          PR_NEEDED=false
          if ! git diff --cached --quiet; then
            # 刻意不带 [skip ci]：版本号 PR 要靠 pull_request CI 产出 main ruleset
            # 所需的「Test + Compat Check」必需检查，门禁才过得去（release/vX 分支
            # 与 tag 推送都不在 ci.yml 的 push branches 列表里，不会引发重复跑）。
            git commit -m "chore: release v$VERSION"
            PR_NEEDED=true
          fi
          git tag -a "v$VERSION" -m "browsa v$VERSION"
          # bump commit 同时推到 release/vX 分支：一是让 tag 指向的提交保持分支
          # 可达（克隆/浅检出可解析，不悬空）；二是它就是版本号 PR 的头——PR 由
          # 末尾的「Open version bump PR」步骤自动开、自动合（详见该步注释）。
          # 注意：实测这对 generate-notes 的 404 滞后没有影响——v0.35.11 推了
          # 分支仍 404 满 7 分钟，v0.35.2 未推分支反而一次成功（Create 步骤注释）。
          # 推不动不阻塞。
          git push origin "HEAD:refs/heads/release/v$VERSION" --force || echo "::warning::release 分支推送失败——tag 指向的提交将仅由 tag 引用保持可达"
          git push origin "v$VERSION"
          # bump 顺手快进到 dev（resting 态 dev==main，纯 fast-forward）：否则下一
          # 个 dev→main PR 会带着 dev 上的旧 manifest.json，把 main 刚对齐的版本
          # 号又打回去——「manifest 旧值属常态」的根源。dev 有未合并提交时非
          # fast-forward 被拒，warning 即可（此时本来就不该强推 dev）。
          git push origin "HEAD:refs/heads/dev" || echo "::warning::bump 未快进到 dev（dev 已分叉）——下个 dev→main PR 会带回旧版本号，合并后请手动对齐 manifest/package 版本"
          echo "pr_needed=$PR_NEEDED" >> "$GITHUB_OUTPUT"

      # 发布顺序（v0.35.11 复盘后倒转）：zip/tests 都已跑完，release 本身
      # 不该等 notes——generate-notes 后端对刚推 tag 的 404 滞后实测在
      # 30 秒～1 小时+ 之间波动（v0.35.3/v0.35.10/v0.35.11 三次翻车全部
      # 源于此；且与 tag 是否在已推分支上无关）。所以：
      #   1) 先试一次 generate-notes（成功即带完整 notes 发布，常态路径零改动）；
      #   2) 404 则立即用本地 git log 兜底发布——zip 上线是主要交付物；
      #   3) 发布后再给后端 ~2 分钟（6×20s）窗口升级 notes，升级失败不
      #      影响发布结果，warning 里给后端恢复后的手动刷新命令。
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ steps.ver.outputs.version }}"
          # notes 显式指定上一个 tag 生成（版本序次新），只含当前增量——
          # 与 tag 之间的祖先关系、release PR 是否合入全部无关。
          PREV=$(git tag --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | grep -vx "v$VERSION" | head -1)
          ARGS=(releases/generate-notes -f tag_name="v$VERSION")
          if [ -n "$PREV" ]; then ARGS+=(-f previous_tag_name="$PREV"); fi
          # 以退出码为准判断成败——gh 出错时会把错误 JSON 打到 stdout，
          # 捕获变量是否为空不可靠（PR #97 的退出码门闸）。
          UPGRADED=""
          if NOTES=$(gh api "${ARGS[@]}" -q .body); then
            UPGRADED=1
          else
            NOTES=""
          fi
          # 本地兜底。注意 PREV 自带 v 前缀，只给 VERSION 补 v——写成 v$PREV
          # 会变成 vv0.35.2，git fatal 128（v0.35.10 实测翻车点）。
          if [ -z "$NOTES" ]; then
            RANGE="v$VERSION"
            [ -n "$PREV" ] && RANGE="$PREV..v$VERSION"
            NOTES=$(git log --format='- %s' "$RANGE")
            [ -z "$NOTES" ] && NOTES="browsa v$VERSION"
          fi
          PREEXIST=""
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            PREEXIST=1
            echo "::notice::release v$VERSION 已存在——跳过创建，仅尝试升级 notes。"
          else
            gh release create "v$VERSION" "browsa-v$VERSION.zip" \
              --title "browsa v$VERSION" \
              --notes "$NOTES"
          fi
          if [ -z "$UPGRADED" ]; then
            for i in $(seq 1 6); do
              sleep 20
              if NEW=$(gh api "${ARGS[@]}" -q .body); then
                if gh release edit "v$VERSION" --notes "$NEW" >/dev/null; then
                  echo "::notice::notes 已升级为 generate-notes 版（第 $i 次重试）"
                  UPGRADED=1
                  break
                fi
              fi
            done
            if [ -z "$UPGRADED" ]; then
              echo "::warning::generate-notes 后端 ~2 分钟内未恢复（实测滞后可达 1 小时+），release 已带本地兜底 notes 发布。后端恢复后手动刷新："
              echo "::warning::gh api \"repos/$GITHUB_REPOSITORY/releases/generate-notes\" -f tag_name=v$VERSION -f previous_tag_name=$PREV -q .body | gh release edit v$VERSION --notes-file -"
            fi
          elif [ -n "$PREEXIST" ]; then
            # 重跑补完场景：release 已在但挂着旧兜底 notes，顺手升级。
            gh release edit "v$VERSION" --notes "$NOTES" >/dev/null && \
              echo "::notice::旧兜底 notes 已升级为 generate-notes 版"
          fi

      # 版本号 PR 自动开、自动合（pi-feishu-notify 同款模式）。放在最后一步：
      # zip/tag/release 都已落地，本步失败不影响已发布的产物，只会留下一个
      # 待人工处理的 PR。不看 pr_needed 门——「上次 run 死在本步」的恢复路径
      # 就是重跑一次（tag+release 已在 → 前面步骤幂等收尾，这里补齐 PR），
      # 与本 workflow 的幂等自愈哲学一致；历史旧 release 没有 release/vX 分支，
      # 分支存在性守卫在这里挡掉（无事可做）。v0.40.4 首跑实录：仓库级
      # 「GitHub Actions 禁止创建 PR」开关未开时本步报
      # GraphQL: not permitted to create or approve pull requests——
      # 已在 Settings→Actions→Workflow permissions 打开 can_approve_pull_request_reviews。
      - name: Open version bump PR and auto-merge
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          RELEASE_BRANCH="release/v$VERSION"
          if ! git ls-remote --heads origin "refs/heads/$RELEASE_BRANCH" | grep -q .; then
            echo "No $RELEASE_BRANCH branch on remote — historical release, nothing to do."
            exit 0
          fi
          PR_URL=$(gh pr list --base main --head "$RELEASE_BRANCH" --state open --json url --jq '.[0].url')
          if [ -z "$PR_URL" ]; then
            if gh pr list --base main --head "$RELEASE_BRANCH" --state merged --json number --jq '.[0].number' | grep -q '[0-9]'; then
              echo "Version bump PR already merged, nothing to do."
              exit 0
            fi
            PR_URL=$(gh pr create --base main --head "$RELEASE_BRANCH" \
              --title "chore: release v$VERSION" \
              --body "发版流程自动创建：把 package.json / package-lock.json / manifest.json 的版本号对齐到已发布的 v$VERSION（此前 bump 提交只随 tag 走，main 的版本号一直落后——即 cws-listing 口径的「manifest 旧值属常态」）。仅版本号变更的 PR 由流程自动合并，无需人工处理。") \
              || { echo "::error::版本号 PR 创建失败（$RELEASE_BRANCH）——请手动创建并合并（v$VERSION 已发布）"; exit 1; }
          fi
          echo "Version bump PR: $PR_URL"
          # 安全阀：只自动合「仅版本号文件」的 PR，混入其它变更立即停下交人工审查
          EXTRA=$(gh pr diff "$PR_URL" --name-only | grep -cvE '^(package\.json|package-lock\.json|manifest\.json)$' || true)
          if [ "$EXTRA" -ne 0 ]; then
            echo "::error::PR $PR_URL 除版本号外还有其它变更，已停止自动合并，请人工审查"
            exit 1
          fi
          # bump 提交不带 [skip ci]，PR 照常跑 pull_request CI 产出 main ruleset
          # 所需的「Test + Compat Check」必需检查（workflow_dispatch 手动补的
          # 检查不计入 PR 门禁，实测无效，勿走回头路）。
          # auto-merge：有必需检查在跑时 --auto 可用，GitHub 在检查通过后自动合入；
          # 若仓库未开 auto-merge 或检查已过（clean status）→ --auto 被拒 → 直接
          # 合并兜底，循环里两种路径都会反复尝试直到合入或检查失败。
          AUTO=0
          for i in $(seq 1 120); do
            STATE=$(gh pr view "$PR_URL" --json state --jq .state)
            if [ "$STATE" = "MERGED" ]; then
              echo "Version bump PR merged automatically: $PR_URL"
              exit 0
            fi
            if [ "$AUTO" = 0 ]; then
              if gh pr merge "$PR_URL" --auto --squash >/dev/null 2>&1; then
                AUTO=1
                echo "Auto-merge enabled for $PR_URL"
              else
                gh pr merge "$PR_URL" --squash >/dev/null 2>&1 \
                  && { echo "Version bump PR merged directly: $PR_URL"; exit 0; }
              fi
            fi
            # 检查失败则提前报错（auto-merge 永远不会完成），不装死
            if gh pr checks "$PR_URL" 2>/dev/null | grep -qw fail; then
              echo "::error::CI 检查未通过，版本号 PR 无法自动合入。v$VERSION 已发布成功，请修复后手动合并：$PR_URL"
              gh pr checks "$PR_URL" || true
              exit 1
            fi
            sleep 5
          done
          echo "::error::版本号 PR 未自动合入（state=$STATE）。v$VERSION 已发布成功，请手动合并：$PR_URL"
          gh pr checks "$PR_URL" || true
          exit 1
