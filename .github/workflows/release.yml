name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（如 0.41.0），不填则使用 package.json 当前版本'
        required: false
        default: ''

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    uses: xiaohuzai/release-flow/.github/workflows/release.yml@v1
    with:
      version: ${{ inputs.version }}
    secrets: inherit
