name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    # job 名即 main ruleset 的必需检查名（"Test + Compat Check"），勿改。
    name: Test + Compat Check
    uses: xiaohuzai/release-flow/.github/workflows/ci.yml@v1
    with:
      # 仅这些源码路径有改动才跑测试；纯文档/样式改动跳过（job 仍报告结论）
      skip_paths: '^(manifest\.json|background\.js|sidepanel\.(js|html)|options\.(js|html)|lib/|test/|build/|_locales/|package\.json|package-lock\.json|check-compat\.sh)'
