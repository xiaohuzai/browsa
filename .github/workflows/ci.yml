name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    name: Test + Compat Check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # 需要完整历史来做 git diff 判断改动范围
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # 只在实际影响软件的路径有改动时才跑 test/compat，
      # 否则（仅 .github/、docs/、*.md、*.css、icons/ 等）跳过以节省时间。
      # 注意：job 本身始终运行并报告成功 —— main 把 "Test + Compat Check"
      # 设为必需 status check，若 job 被整体跳过则 check 无结论，PR 无法合并。
      - name: Detect source changes
        id: changes
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          else
            BASE="${{ github.event.before }}"
          fi
          echo "Base: $BASE  Head: ${{ github.sha }}"
          CHANGED=$(git diff --name-only "$BASE" "${{ github.sha }}")
          echo "Changed files:"
          echo "$CHANGED"
          if echo "$CHANGED" | grep -qE '^(manifest\.json|background\.js|sidepanel\.(js|html)|options\.(js|html)|lib/|test/|build/|_locales/|package\.json|package-lock\.json|check-compat\.sh)'; then
            echo "source_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "source_changed=false" >> "$GITHUB_OUTPUT"
          fi

      # ── 全量测试结果复用（2026-09-24）─────────────────────────────────
      # 同一内容树 + 同一环境 = 测试结果可转移（npm ci + lockfile 钉死依赖、
      # Node 20 钉死环境）。缓存键用**树哈希**而非 commit SHA——squash 合并换
      # SHA 不换树，「PR 测过、main push 再测」的纯重复由此消除；revert 回旧
      # 内容也能命中最初的记录。键带 OS/Node 前缀，环境一变自然失效。
      # 只缓存最贵的 npm test；npm ci / check-compat 永远现场跑（秒级且吃环境）。
      - name: Compute tree hash
        id: tree
        run: echo "hash=$(git rev-parse 'HEAD^{tree}')" >> "$GITHUB_OUTPUT"

      - name: Lookup previous full-test result
        id: testcache
        uses: actions/cache/restore@v4
        with:
          path: .fulltest-pass
          key: fulltest-${{ runner.os }}-node20-${{ steps.tree.outputs.hash }}
          lookup-only: true

      - name: Reuse full-test result
        if: steps.changes.outputs.source_changed == 'true' && steps.testcache.outputs.cache-hit == 'true'
        run: echo "::notice::全量测试结果复用自同树同环境的既有记录（tree ${{ steps.tree.outputs.hash }}）——语义=这份内容在本环境全量测过一次"

      - name: Run tests
        if: steps.changes.outputs.source_changed == 'true' && steps.testcache.outputs.cache-hit != 'true'
        run: npm test

      - name: Run MV3 compat check
        if: steps.changes.outputs.source_changed == 'true'
        run: bash check-compat.sh

      - name: Record full-test result
        if: steps.changes.outputs.source_changed == 'true' && steps.testcache.outputs.cache-hit != 'true' && success()
        run: echo "passed by ${{ github.sha }} at $(date -u +%FT%TZ)" > .fulltest-pass

      - name: Save full-test result
        if: steps.changes.outputs.source_changed == 'true' && steps.testcache.outputs.cache-hit != 'true' && success()
        uses: actions/cache/save@v4
        with:
          path: .fulltest-pass
          key: fulltest-${{ runner.os }}-node20-${{ steps.tree.outputs.hash }}