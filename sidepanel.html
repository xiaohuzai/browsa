<!doctype html>
<html lang="zh">
  <head>
    <meta charset="utf-8" />
    <title>browsa</title>
    <link rel="stylesheet" href="sidepanel.css" />
  </head>
  <body>
    <a href="#input" class="skip-link">Skip to composer</a>

    <!-- Slim topbar: just provider + utility buttons -->
    <header class="topbar" role="banner">
      <select id="provider" class="provider" aria-label="AI provider"></select>
      <button id="sessions-btn" class="iconbtn" aria-label="Session history" title="Session history">
        <svg width="14" height="14" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm1-12a1 1 0 10-2 0v4a1 1 0 00.293.707l2.828 2.829a1 1 0 101.415-1.415L11 9.586V6z" clip-rule="evenodd"/></svg>
      </button>

      <button id="search-btn" class="iconbtn" aria-label="Search messages" title="Search messages (Ctrl+F)">
        <svg width="14" height="14" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M8 4a4 4 0 100 8 4 4 0 000-8zM2 8a6 6 0 1110.89 3.476l4.817 4.817a1 1 0 01-1.414 1.414l-4.816-4.816A6 6 0 012 8z" clip-rule="evenodd"/></svg>
      </button>
      <button id="multiselect-toggle" class="iconbtn" aria-label="Select messages" title="Select messages">
        <svg width="14" height="14" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z" clip-rule="evenodd"/></svg>
      </button>
      <button id="settings" class="iconbtn" aria-label="Settings" title="Settings">
        <svg width="15" height="15" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M11.49 3.17c-.38-1.56-2.6-1.56-2.98 0a1.532 1.532 0 01-2.286.948c-1.372-.836-2.942.734-2.106 2.106.54.886.061 2.042-.947 2.287-1.561.379-1.561 2.6 0 2.978a1.532 1.532 0 01.947 2.287c-.836 1.372.734 2.942 2.106 2.106a1.532 1.532 0 012.287.947c.379 1.561 2.6 1.561 2.978 0a1.533 1.533 0 012.287-.947c1.372.836 2.942-.734 2.106-2.106a1.533 1.533 0 01.947-2.287c1.561-.379 1.561-2.6 0-2.978a1.532 1.532 0 01-.947-2.287c.836-1.372-.734-2.942-2.106-2.106a1.532 1.532 0 01-2.287-.947zM10 13a3 3 0 100-6 3 3 0 000 6z" clip-rule="evenodd"/></svg>
      </button>
    </header>

    <!-- Sessions drawer (slides in from the right) -->
    <div id="sessions-drawer" class="sessions-drawer" hidden role="dialog" aria-labelledby="sessions-drawer-title">
      <div class="sessions-drawer-header">
        <span id="sessions-drawer-title" class="sessions-drawer-title">Session History</span>
        <button id="sessions-clear-all" class="iconbtn sessions-clear-all-btn" title="Clear all sessions">🗑</button>
        <button id="sessions-close" class="iconbtn" title="Close">✕</button>
      </div>
      <div class="sessions-drawer-actions">
        <button id="sessions-new" class="sessions-new-btn">＋ New session</button>
        <input type="search" class="sessions-search" placeholder="Search sessions…" aria-label="Search sessions" />
      </div>
      <div id="sessions-list" class="sessions-list"></div>
    </div>

    <!-- Diagnostics banner -->
    <div id="diagnostics" class="diagnostics" role="status" aria-live="polite" hidden></div>

    <!-- In-conversation search bar (Ctrl+F) -->
    <div id="msg-search-bar" class="msg-search-bar" hidden role="search">
      <input id="msg-search-input" class="msg-search-input" type="search" placeholder="Search messages…" aria-label="Search messages" />
      <span id="msg-search-count" class="msg-search-count"></span>
      <button id="msg-search-prev" class="msg-search-nav" title="Previous (Shift+Enter)">↑</button>
      <button id="msg-search-next" class="msg-search-nav" title="Next (Enter)">↓</button>
      <button id="msg-search-close" class="msg-search-close" title="Close (Esc)">✕</button>
    </div>

    <!-- Multi-select action bar (shown when multi-select active) -->
    <div id="multiselect-bar" class="multiselect-bar" hidden>
      <span id="multiselect-count" class="multiselect-count">0 selected</span>
      <button id="multiselect-delete" class="multiselect-delete-btn">Delete selected</button>
      <button id="multiselect-cancel" class="multiselect-cancel-btn">Cancel</button>
    </div>

    <!-- Messages -->
    <main id="messages" class="messages" role="log" aria-live="polite" aria-atomic="false"></main>

    <!-- Quick action pills -->
    <div class="quickbar" id="quickbar" role="toolbar" aria-label="Quick actions">
      <button class="qa-btn" data-cmd="/summarize" title="Summarize the page">Summarize</button>
      <button class="qa-btn" data-cmd="/keypoints" title="Extract key points">Key Points</button>
      <button class="qa-btn" data-cmd="/explain" title="Explain the content">Explain</button>
      <button class="qa-btn" data-cmd="/translate" title="Translate to Chinese">→ 中文</button>
      <button class="qa-btn" data-cmd="/outline" title="Show outline">Outline</button>
    </div>

    <!-- Slash command autocomplete -->
    <div id="slash-suggest" class="slash-suggest" hidden></div>

    <!-- Composer -->
    <footer class="composer">
      <div id="imagepreviews" class="imagepreviews"></div>
      <div class="composer-box">
        <button id="clear" class="attachbtn" aria-label="New conversation" title="New conversation (Ctrl+K)">
          <svg width="14" height="14" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M9 2a1 1 0 00-.894.553L7.382 4H4a1 1 0 000 2v10a2 2 0 002 2h8a2 2 0 002-2V6a1 1 0 100-2h-3.382l-.724-1.447A1 1 0 0011 2H9zM7 8a1 1 0 012 0v6a1 1 0 11-2 0V8zm5-1a1 1 0 00-1 1v6a1 1 0 102 0V8a1 1 0 00-1-1z" clip-rule="evenodd"/></svg>
        </button>
        <button id="attach" class="attachbtn" aria-label="Attach current page" title="Attach current page to conversation">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg>
        </button>
        <label for="input" class="visually-hidden">Message</label>
        <textarea
          id="input"
          rows="1"
          placeholder="Ask anything… use 📎 to attach current page"
          aria-label="Message"
        ></textarea>
        <button id="send" class="sendbtn" aria-label="Send">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M3.478 2.405a.75.75 0 00-.926.94l2.432 7.905H13.5a.75.75 0 010 1.5H4.984l-2.432 7.905a.75.75 0 00.926.94 60.519 60.519 0 0018.445-8.986.75.75 0 000-1.218A60.517 60.517 0 003.478 2.405z"/></svg>
        </button>
      </div>
      <!-- Context mode + page link -->
      <div class="composer-footer">
        <div class="ctx-group" role="group" aria-label="Context mode">
          <label class="ctx-pill" title="Auto: Reader → DOM → Full (smart cascade)"><input type="radio" name="ctx" value="auto" />Auto</label>
          <label class="ctx-pill" title="Capture screenshot"><input type="radio" name="ctx" value="screenshot" />📷</label>
        </div>
        <a id="pagemeta" class="pagemeta" target="_blank" title=""></a>
      </div>
      <div id="composerinfo" class="composerinfo" aria-live="polite">
        <span id="charcount">0</span> chars · <span id="tokcount">~0</span> tokens
        <span id="imageinfo" class="imageinfo"></span>
      </div>
    </footer>

    <input type="file" id="imagepicker" class="visually-hidden" accept="image/*" multiple />
    <script type="module" src="sidepanel.js"></script>
  </body>
</html>
