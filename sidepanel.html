<!doctype html>
<html lang="zh">
  <head>
    <meta charset="utf-8" />
    <title>browsa</title>
    <link rel="stylesheet" href="sidepanel.css" />
  </head>
  <body>
    <a href="#input" class="skip-link">Skip to composer</a>
    <header class="topbar" role="banner">
      <div class="brand" aria-label="browsa">browsa</div>
      <label class="provider-label" for="provider">🤖</label>
      <select id="provider" class="provider" aria-label="选择后端" title="Switch AI backend (Hermes / Claude Code / any OpenAI-compatible)"></select>
      <button id="settings" class="iconbtn" aria-label="设置 (provider / API key)" title="设置 (provider / API key)">⚙</button>
    </header>

    <div class="contextbar" role="group" aria-label="Page context mode">
      <span class="ctx-label" id="ctx-label">Context:</span>
      <label class="ctx-opt" title="Mozilla Readability: extract main article, strip nav/ads/comments"><input type="radio" name="ctx" value="reader" /> Reader</label>
      <label class="ctx-opt" title="Body innerText (no Readability filtering)"><input type="radio" name="ctx" value="full" /> Full</label>
      <label class="ctx-opt"><input type="radio" name="ctx" value="selected" /> Selection</label>
      <label class="ctx-opt"><input type="radio" name="ctx" value="screenshot" /> Screenshot</label>
      <label class="ctx-opt">
        <input type="checkbox" id="autoattach" checked aria-describedby="ctx-label" /> Auto-attach
      </label>
      <label class="ctx-opt" title="Wait 2s for JS to render (React/Vue/SPA sites like 小红书)">
        <input type="checkbox" id="waitjs" /> ⏳ Wait JS
      </label>
      <a id="pagemeta" class="pagemeta" target="_blank" title=""></a>
    </div>

    <div id="diagnostics" class="diagnostics" role="status" aria-live="polite" hidden></div>

    <main id="messages" class="messages" role="log" aria-live="polite" aria-atomic="false"></main>

    <footer class="composer">
      <div id="imagepreviews" class="imagepreviews"></div>
      <div class="row">
        <label for="input" class="visually-hidden">Message input</label>
        <textarea
          id="input"
          rows="2"
          placeholder="Type a question for your agent… (Enter to send, Shift+Enter for newline; paste or drag images)"
          aria-label="Message input"
        ></textarea>
        <button id="send" class="sendbtn" aria-label="Send message">Send</button>
      </div>
      <div id="composerinfo" class="composerinfo" title="Approx input size (chars) and estimated tokens" aria-live="polite">
        <span id="charcount">0</span> chars · <span id="tokcount">~0</span> tokens
        <span id="imageinfo" class="imageinfo"></span>
      </div>
    </footer>
    <input type="file" id="imagepicker" class="visually-hidden" accept="image/*" multiple />

    <script type="module" src="sidepanel.js"></script>
  </body>
</html>
