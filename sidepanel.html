<!doctype html>
<html lang="zh">
  <head>
    <meta charset="utf-8" />
    <title>browsa</title>
    <link rel="stylesheet" href="sidepanel.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand">browsa</div>
      <select id="provider" class="provider" title="选择后端"></select>
      <button id="settings" class="iconbtn" title="设置 (provider / API key)">⚙</button>
    </header>

    <div class="contextbar">
      <span class="ctx-label">Context:</span>
      <label class="ctx-opt" title="Mozilla Readability: extract main article, strip nav/ads/comments"><input type="radio" name="ctx" value="reader" /> Reader</label>
      <label class="ctx-opt" title="Body innerText (no Readability filtering)"><input type="radio" name="ctx" value="full" /> Full</label>
      <label class="ctx-opt"><input type="radio" name="ctx" value="selected" /> Selection</label>
      <label class="ctx-opt"><input type="radio" name="ctx" value="screenshot" /> Screenshot</label>
      <label class="ctx-opt">
        <input type="checkbox" id="autoattach" checked /> Auto-attach
      </label>
      <a id="pagemeta" class="pagemeta" target="_blank" title=""></a>
    </div>

    <main id="messages" class="messages"></main>

    <footer class="composer">
      <div class="row">
        <textarea
          id="input"
          rows="2"
          placeholder="Type a question for your agent… (Enter to send, Shift+Enter for newline)"
        ></textarea>
        <button id="send" class="sendbtn">Send</button>
      </div>
      <div id="composerinfo" class="composerinfo" title="Approx input size (chars) and estimated tokens">
        <span id="charcount">0</span> chars · <span id="tokcount">~0</span> tokens
      </div>
    </footer>

    <script type="module" src="sidepanel.js"></script>
  </body>
</html>
