<!doctype html><html lang="zh"><head><meta charset="utf-8"><style>
@font-face{font-family:'Inter';src:url('InterVar.ttf');font-weight:100 900}
@font-face{font-family:'Noto SC';src:url('/.agents/skills/promo-video/scripts/node_modules/@fontsource/noto-sans-sc/files/noto-sans-sc-chinese-simplified-400-normal.woff2') format('woff2');font-weight:400}
@font-face{font-family:'Noto SC';src:url('/.agents/skills/promo-video/scripts/node_modules/@fontsource/noto-sans-sc/files/noto-sans-sc-chinese-simplified-700-normal.woff2') format('woff2');font-weight:700}
@font-face{font-family:'Space Grotesk';src:url('/fonts/SpaceGrotesk.ttf');font-weight:300 700}
*{margin:0;padding:0;box-sizing:border-box}
body{width:1400px;height:560px;overflow:hidden;position:relative;
  font-family:'Inter','Noto SC',-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
  background:#f5f6f3;color:#14171f}
.glow{position:absolute;inset:0;background:
  radial-gradient(ellipse 900px 300px at 50% 118%,rgba(194,65,12,.10),transparent 62%),
  radial-gradient(ellipse 480px 240px at 6% 120%,rgba(146,108,13,.09),transparent 58%),
  radial-gradient(ellipse 480px 240px at 94% 120%,rgba(146,108,13,.09),transparent 58%)}
.mark-br{position:absolute;right:26px;bottom:26px;width:22px;height:22px}
.mark-br::before{content:"";position:absolute;bottom:0;left:0;width:100%;height:1.5px;background:#5b6270;opacity:.5}
.mark-br::after{content:"";position:absolute;top:0;right:0;width:1.5px;height:100%;background:#5b6270;opacity:.5}
.wrap{position:relative;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 110px 40px}
.eyebrow{font-family:ui-monospace,"SF Mono",Consolas,monospace;font-size:18px;font-weight:600;letter-spacing:.14em;color:#6f5206;display:flex;align-items:center;gap:18px;margin-bottom:30px}
.eyebrow::before,.eyebrow::after{content:"";width:44px;height:2px;background:#926c0d}
h1{font-size:78px;font-weight:700;letter-spacing:.01em;line-height:1.1;margin-bottom:28px}
em{font-style:normal;color:#c2410c;background:linear-gradient(transparent 62%,rgba(194,65,12,.18) 62%);padding:0 .04em}
.sub{font-size:21px;color:#3a3f4a;line-height:1.8;max-width:1220px}
.footrow{position:absolute;left:120px;right:120px;bottom:46px;display:flex;align-items:center;justify-content:space-between}
.wordmark{font-family:'Space Grotesk',ui-monospace,Consolas,monospace;font-size:29px;font-weight:700;letter-spacing:.05em;color:#c2410c}
.badge{font-family:ui-monospace,Consolas,monospace;font-size:16px;color:#f5f6f3;background:#14171f;padding:9px 22px;border-radius:999px;letter-spacing:.03em}
.ts{display:inline-block;padding:.05em .35em;border-radius:8px;color:#d4a72c;background:rgba(212,167,44,.16);font-variant-numeric:tabular-nums}
</style></head><body>
<div class="glow"></div>
<div class="wrap">

  <p class="sub">把正在看的页面——文章、视频、PDF——交给自己的模型或智能体。回复带可点击时间戳 <span class="ts">[07:42]</span>，开源免订阅。</p>
</div>
<div class="footrow">
  <span class="wordmark">browsa</span>
  <span class="badge">MIT · 你的 Key，你的智能体</span>
</div>
<div class="mark-br"></div>
</body></html>
